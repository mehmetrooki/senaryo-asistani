# Render.com Blueprint: depoyu bağlayınca bu ayarlarla kurulur.
services:
  - type: web
    name: senaryo-asistani
    runtime: docker
    plan: starter            # kalıcı disk ücretsiz planda yok
    healthCheckPath: /saglik
    disk:
      name: senaryo-verisi
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SENARYO_ERISIM_ANAHTARI
        sync: false          # .env'deki 256 baytlık anahtarı yapıştırın
      - key: ANTHROPIC_API_KEY
        sync: false          # isteğe bağlı
